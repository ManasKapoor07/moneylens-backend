spring:
  application:
    name: moneylens-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/moneylensdb
    driver-class-name: org.postgresql.Driver
    username: manaskapoor
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dev@moneylens.com}
    password: ${MAIL_PASSWORD:devpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  h2:
    console:
      enabled: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:MoneyLensSecretKeyForJWTTokenGenerationMustBe256BitsLongAtMinimum2024}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  email-verification:
    enabled: false
    token-expiry-hours: 24

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.moneylens: DEBUG
    org.springframework.security: INFO

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  email-verification:
    enabled: true

logging:
  level:
    com.moneylens: INFO
    org.springframework.security: WARN